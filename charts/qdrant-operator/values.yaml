replicaCount: 1  # above 1 only with ha.enabled; otherwise every replica would reconcile

ha:
  enabled: false  # kopf peering: one replica is active, the others wait as standbys; the Deployment rolls instead of recreating
  peeringName: ""  # empty uses the release full name
  lifetime: 60  # seconds before a standby takes over from an active pod that died without a clean exit; a clean shutdown hands over at once
  namespaces: []  # empty: cluster-wide with a ClusterKopfPeering; names: the operator watches only these and a KopfPeering is created in each

image:
  repository: ghcr.io/4thel00z/qdrant-operator
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 1Gi   # interpreter and kopf's per-resource state; a migration loop alone held ~320Mi, a backup ~280Mi, and both can run at once (S3 upload parts: 8MiB x 2; Qdrant stream chunks: 1MiB)
  requests:
    cpu: 100m
    memory: 128Mi

operator:
  logLevel: INFO
  logFormat: json  # json | text
  chartRepo: ""  # qdrant-helm repository for mirrored or air-gapped installs; an oci:// URL also works. Empty uses https://qdrant.github.io/qdrant-helm

metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
