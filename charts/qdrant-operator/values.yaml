replicaCount: 1

image:
  repository: ghcr.io/4thel00z/qdrant-operator
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi   # snapshot streaming buffers up to ~32MiB of multipart parts on top of the interpreter
  requests:
    cpu: 100m
    memory: 128Mi

operator:
  logLevel: INFO
  logFormat: json  # json | text
