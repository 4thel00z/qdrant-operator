---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: qdrantbackups.qdrant.io
spec:
  group: qdrant.io
  names:
    kind: QdrantBackup
    listKind: QdrantBackupList
    plural: qdrantbackups
    shortNames:
    - qb
    singular: qdrantbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.totalSize
      name: Size
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              clusterRef:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              collections:
                description: Collections to back up (empty = all). Every node is snapshotted.
                items:
                  type: string
                type: array
              method:
                default: s3
                description: s3 streams node snapshots into a bucket. volumeSnapshot
                  takes a CSI VolumeSnapshot of every data PVC (crash-consistent,
                  restorable only into a new cluster of the same name and size in
                  the same namespace).
                enum:
                - s3
                - volumeSnapshot
                type: string
              retentionDays:
                description: Number of days to retain this backup
                format: int32
                minimum: 1
                type: integer
              storage:
                properties:
                  s3:
                    properties:
                      bucket:
                        type: string
                      credentialsSecretRef:
                        properties:
                          accessKeyIdKey:
                            default: AWS_ACCESS_KEY_ID
                            type: string
                          name:
                            type: string
                          secretAccessKeyKey:
                            default: AWS_SECRET_ACCESS_KEY
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: Custom endpoint for S3-compatible storage (MinIO,
                          etc.)
                        type: string
                      forcePathStyle:
                        default: false
                        description: Use path-style URLs (required for MinIO)
                        type: boolean
                      prefix:
                        default: ""
                        type: string
                      region:
                        default: us-east-1
                        type: string
                    required:
                    - bucket
                    - credentialsSecretRef
                    type: object
                required:
                - s3
                type: object
              volumeSnapshotClassName:
                description: VolumeSnapshotClass to use; required when method is volumeSnapshot
                type: string
            required:
            - clusterRef
            type: object
            x-kubernetes-validations:
            - message: storage.s3 is required when method is s3
              rule: self.method == 'volumeSnapshot' || has(self.storage)
            - message: volumeSnapshotClassName is required when method is volumeSnapshot
              rule: self.method != 'volumeSnapshot' || has(self.volumeSnapshotClassName)
            - message: spec is immutable; create a new QdrantBackup instead
              rule: self == oldSelf
          status:
            properties:
              collections:
                items:
                  properties:
                    error:
                      type: string
                    name:
                      type: string
                    size:
                      type: string
                    snapshots:
                      description: One snapshot per cluster node; each holds that
                        node's shards
                      items:
                        properties:
                          key:
                            type: string
                          node:
                            type: string
                          snapshotName:
                            type: string
                        type: object
                      type: array
                    status:
                      enum:
                      - Pending
                      - InProgress
                      - Completed
                      - Failed
                      type: string
                  type: object
                type: array
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              error:
                type: string
              expiresAt:
                description: When retentionDays elapse and the operator deletes this
                  backup
                format: date-time
                type: string
              inProgressSnapshot:
                description: Node snapshot being streamed right now, cleared once
                  deleted
                properties:
                  collection:
                    type: string
                  nodeIndex:
                    format: int32
                    type: integer
                  snapshot:
                    type: string
                type: object
              phase:
                enum:
                - Pending
                - InProgress
                - Completed
                - Failed
                type: string
              s3Path:
                description: Full S3 path where backup is stored
                type: string
              startTime:
                description: First attempt's start; kept across operator restarts
                format: date-time
                type: string
              totalSize:
                description: Total size of backup (human-readable)
                type: string
              volumeSnapshots:
                description: One VolumeSnapshot per data PVC; set when method is volumeSnapshot
                items:
                  properties:
                    accessModes:
                      items:
                        type: string
                      type: array
                    claimName:
                      type: string
                    nodeIndex:
                      format: int32
                      type: integer
                    size:
                      description: Size requested by the snapshotted claim
                      type: string
                    snapshotName:
                      type: string
                    storageClassName:
                      type: string
                    zone:
                      description: Zone of the snapshotted volume; a restore provisions
                        the claim on a node in it
                      type: string
                    zoneLabel:
                      description: Node label that carries the zone, taken from the
                        volume's node affinity
                      type: string
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
