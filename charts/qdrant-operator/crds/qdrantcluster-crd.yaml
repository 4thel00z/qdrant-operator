apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: qdrantclusters.qdrant.io
spec:
  group: qdrant.io
  names:
    kind: QdrantCluster
    listKind: QdrantClusterList
    plural: qdrantclusters
    singular: qdrantcluster
    shortNames:
      - qc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Replicas
          type: integer
          jsonPath: .status.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - version
              x-kubernetes-validations:
                - rule: "self.replicas == 1 || !has(self.cluster) || self.cluster.enabled"
                  message: "replicas > 1 requires cluster.enabled"
                - rule: "(has(self.persistence) ? self.persistence.size : '10Gi') == (has(oldSelf.persistence) ? oldSelf.persistence.size : '10Gi')"
                  message: "persistence.size is immutable (StatefulSet volume claim templates cannot change)"
                - rule: "(has(self.persistence) && has(self.persistence.storageClassName) ? self.persistence.storageClassName : '') == (has(oldSelf.persistence) && has(oldSelf.persistence.storageClassName) ? oldSelf.persistence.storageClassName : '')"
                  message: "persistence.storageClassName is immutable"
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                version:
                  type: string
                  pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
                  description: Qdrant version, also the qdrant-helm chart version (e.g. v1.16.3)
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                      default: "docker.io/qdrant/qdrant"
                    pullPolicy:
                      type: string
                      enum: ["Always", "IfNotPresent", "Never"]
                      default: "IfNotPresent"
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                persistence:
                  type: object
                  properties:
                    size:
                      type: string
                      default: "10Gi"
                    storageClassName:
                      type: string
                    accessModes:
                      type: array
                      items:
                        type: string
                      default: ["ReadWriteOnce"]
                snapshotPersistence:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    size:
                      type: string
                      default: "10Gi"
                    storageClassName:
                      type: string
                cluster:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    p2p:
                      type: object
                      properties:
                        port:
                          type: integer
                          default: 6335
                        enableTls:
                          type: boolean
                          default: false
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: ["ClusterIP", "LoadBalancer", "NodePort"]
                      default: "ClusterIP"
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                apiKey:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!(has(self.secretRef) && self.autoGenerate)"
                      message: "set either secretRef or autoGenerate, not both"
                    - rule: "!self.jwtRbac || has(self.secretRef) || self.autoGenerate"
                      message: "jwtRbac needs an API key (secretRef or autoGenerate) to sign tokens with"
                  properties:
                    jwtRbac:
                      type: boolean
                      default: false
                      description: Enable JWT role-based access (service.jwt_rbac); QdrantAccessKey resources need it
                    secretRef:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    autoGenerate:
                      type: boolean
                      default: false
                readOnlyApiKey:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!(has(self.secretRef) && self.autoGenerate)"
                      message: "set either secretRef or autoGenerate, not both"
                  properties:
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    autoGenerate:
                      type: boolean
                      default: false
                tls:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!self.enabled || (has(self.secretRef) && has(self.secretRef.name))"
                      message: "tls.enabled requires tls.secretRef.name (a kubernetes.io/tls secret)"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                metrics:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    serviceMonitor:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        interval:
                          type: string
                          default: "30s"
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      operator:
                        type: string
                      value:
                        type: string
                      effect:
                        type: string
                      tolerationSeconds:
                        type: integer
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                config:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Failed", "Upgrading", "Terminating"]
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
                version:
                  type: string
                helmRelease:
                  type: string
                endpoint:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64