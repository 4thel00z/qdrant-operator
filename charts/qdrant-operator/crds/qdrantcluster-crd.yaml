apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: qdrantclusters.qdrant.io
spec:
  group: qdrant.io
  names:
    kind: QdrantCluster
    listKind: QdrantClusterList
    plural: qdrantclusters
    singular: qdrantcluster
    shortNames:
      - qc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Replicas
          type: integer
          jsonPath: .status.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - version
              x-kubernetes-validations:
                - rule: "self.replicas == 1 || !has(self.cluster) || self.cluster.enabled"
                  message: "replicas > 1 requires cluster.enabled"
                - rule: "(has(self.persistence) && has(self.persistence.size) ? quantity(self.persistence.size) : quantity('10Gi')).compareTo(has(oldSelf.persistence) && has(oldSelf.persistence.size) ? quantity(oldSelf.persistence.size) : quantity('10Gi')) >= 0"
                  message: "persistence.size can grow but not shrink"
                - rule: "(has(self.snapshotPersistence) && has(self.snapshotPersistence.size) ? quantity(self.snapshotPersistence.size) : quantity('10Gi')).compareTo(has(oldSelf.snapshotPersistence) && has(oldSelf.snapshotPersistence.size) ? quantity(oldSelf.snapshotPersistence.size) : quantity('10Gi')) >= 0"
                  message: "snapshotPersistence.size can grow but not shrink"
                - rule: "(has(self.persistence) && has(self.persistence.storageClassName) ? self.persistence.storageClassName : '') == (has(oldSelf.persistence) && has(oldSelf.persistence.storageClassName) ? oldSelf.persistence.storageClassName : '')"
                  message: "persistence.storageClassName is immutable"
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                version:
                  type: string
                  pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
                  description: Qdrant version, also the qdrant-helm chart version (e.g. v1.16.3)
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                      default: "docker.io/qdrant/qdrant"
                    pullPolicy:
                      type: string
                      enum: ["Always", "IfNotPresent", "Never"]
                      default: "IfNotPresent"
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                persistence:
                  type: object
                  properties:
                    size:
                      type: string
                      maxLength: 20
                      default: "10Gi"
                      description: Volume size per pod; increases are applied to the PVCs and the StatefulSet is recreated, decreases are rejected
                    storageClassName:
                      type: string
                    accessModes:
                      type: array
                      items:
                        type: string
                      default: ["ReadWriteOnce"]
                    reclaimPolicy:
                      type: string
                      enum: ["Retain", "Delete"]
                      default: "Retain"
                      description: Delete removes the cluster's PersistentVolumeClaims (data and snapshots) when the QdrantCluster is deleted; Retain keeps them
                snapshotPersistence:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    size:
                      type: string
                      maxLength: 20
                      default: "10Gi"
                      description: Snapshot volume size per pod; size it for the largest snapshot of one node (a full copy of its shards)
                    storageClassName:
                      type: string
                cluster:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    p2p:
                      type: object
                      properties:
                        port:
                          type: integer
                          default: 6335
                        enableTls:
                          type: boolean
                          default: false
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: ["ClusterIP", "LoadBalancer", "NodePort"]
                      default: "ClusterIP"
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                apiKey:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!(has(self.secretRef) && self.autoGenerate)"
                      message: "set either secretRef or autoGenerate, not both"
                    - rule: "!self.jwtRbac || has(self.secretRef) || self.autoGenerate"
                      message: "jwtRbac needs an API key (secretRef or autoGenerate) to sign tokens with"
                  properties:
                    jwtRbac:
                      type: boolean
                      default: false
                      description: Enable JWT role-based access (service.jwt_rbac); QdrantAccessKey resources need it
                    secretRef:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    autoGenerate:
                      type: boolean
                      default: false
                readOnlyApiKey:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!(has(self.secretRef) && self.autoGenerate)"
                      message: "set either secretRef or autoGenerate, not both"
                  properties:
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    autoGenerate:
                      type: boolean
                      default: false
                tls:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!self.enabled || (has(self.secretRef) && has(self.secretRef.name))"
                      message: "tls.enabled requires tls.secretRef.name (a kubernetes.io/tls secret)"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                metrics:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    serviceMonitor:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        interval:
                          type: string
                          default: "30s"
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                podAnnotations:
                  type: object
                  additionalProperties:
                    type: string
                  description: Annotations on the Qdrant pods (e.g. scrape hints for a metrics collector)
                podLabels:
                  type: object
                  additionalProperties:
                    type: string
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      operator:
                        type: string
                      value:
                        type: string
                      effect:
                        type: string
                      tolerationSeconds:
                        type: integer
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                podDisruptionBudget:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!(has(self.maxUnavailable) && has(self.minAvailable))"
                      message: "set either maxUnavailable or minAvailable, not both"
                  description: PodDisruptionBudget of the pods; enabled by default when replicas > 1 with maxUnavailable 1
                  properties:
                    enabled:
                      type: boolean
                      description: Unset means on when replicas > 1
                    maxUnavailable:
                      x-kubernetes-int-or-string: true
                    minAvailable:
                      x-kubernetes-int-or-string: true
                topologySpread:
                  type: object
                  description: Spread of pods over nodes (on by default when replicas > 1) and zones (opt in)
                  properties:
                    hostname:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        maxSkew:
                          type: integer
                          minimum: 1
                          default: 1
                        whenUnsatisfiable:
                          type: string
                          enum: ["ScheduleAnyway", "DoNotSchedule"]
                          default: "ScheduleAnyway"
                    zone:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        maxSkew:
                          type: integer
                          minimum: 1
                          default: 1
                        whenUnsatisfiable:
                          type: string
                          enum: ["ScheduleAnyway", "DoNotSchedule"]
                          default: "ScheduleAnyway"
                    constraints:
                      type: array
                      description: Replaces the generated constraints; labelSelector defaults to the cluster's pods; an empty list disables spreading
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                minReadySeconds:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Seconds a pod must be Ready before the rolling update moves to the next one
                scaling:
                  type: object
                  description: Opt-in peer management when the replica count changes or pods are rebuilt
                  properties:
                    drainOnScaleDown:
                      type: boolean
                      default: false
                      description: Before removing pods, move their shard replicas to the remaining peers and remove the peers from consensus
                    removeDeadPeers:
                      type: boolean
                      default: false
                      description: Re-replicate shards off peers whose pod was rebuilt on an empty volume, then remove those peers
                    rebalance:
                      type: boolean
                      default: false
                      description: Keep every collection at its replication factor and its replicas spread evenly over the pods, e.g. after a scale-up, a restore or a peer repair; one shard operation per collection at a time
                rollout:
                  type: object
                  description: How pods are restarted when the pod template changes
                  properties:
                    strategy:
                      type: string
                      enum: ["ShardHealth", "Readiness"]
                      default: "ShardHealth"
                      description: ShardHealth has the operator lower the StatefulSet partition one pod at a time, each only once every pod is Ready, every shard replica is Active, no transfer runs and every pod is a peer. Readiness is the plain StatefulSet RollingUpdate with partition 0
                config:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Failed", "Upgrading", "Terminating"]
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
                updatedReplicas:
                  type: integer
                currentRevision:
                  type: string
                updateRevision:
                  type: string
                appliedHash:
                  type: string
                  description: Digest of the chart version and values last applied; an unchanged digest skips the helm upgrade
                version:
                  type: string
                helmRelease:
                  type: string
                endpoint:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64