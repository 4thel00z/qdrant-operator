{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "qdrant-operator.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "qdrant-operator.labels" $ | nindent 4 }}
rules:
  {{- include "qdrant-operator.namespacedRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "qdrant-operator.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "qdrant-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "qdrant-operator.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "qdrant-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
