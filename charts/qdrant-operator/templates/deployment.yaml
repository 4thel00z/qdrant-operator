apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qdrant-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qdrant-operator.labels" . | nindent 4 }}
spec:
  {{- if and (gt (int .Values.replicaCount) 1) (not .Values.ha.enabled) }}
  {{- fail "replicaCount above 1 needs ha.enabled=true; without leader election every replica would reconcile" }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.ha.enabled }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "qdrant-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qdrant-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "qdrant-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: QDRANT_OPERATOR_LOGGING_LEVEL
              value: {{ .Values.operator.logLevel | lower | quote }}
            - name: QDRANT_OPERATOR_LOGGING_FORMAT
              value: {{ .Values.operator.logFormat | quote }}
            - name: QDRANT_OPERATOR_MANAGER_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: QDRANT_OPERATOR_MANAGER_LEADER_ELECTION
              value: {{ .Values.ha.enabled | quote }}
            - name: QDRANT_OPERATOR_MANAGER_LEADER_ELECTION_ID
              value: {{ include "qdrant-operator.leaseName" . | quote }}
            - name: QDRANT_OPERATOR_MANAGER_LEASE_DURATION
              value: {{ .Values.ha.leaseDuration | quote }}
            - name: QDRANT_OPERATOR_METRICS_ADDRESS
              value: {{ ternary (printf ":%v" .Values.metrics.port) "0" .Values.metrics.enabled | quote }}
            {{- with .Values.operator.chartRepo }}
            - name: QDRANT_OPERATOR_HELM_REPO
              value: {{ . | quote }}
            {{- end }}
            - name: QDRANT_OPERATOR_HELM_CACHE_DIR
              value: /tmp/helm/charts
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          ports:
            - name: health
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
