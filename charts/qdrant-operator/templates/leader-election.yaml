apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "qdrant-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qdrant-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "qdrant-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qdrant-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "qdrant-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "qdrant-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
