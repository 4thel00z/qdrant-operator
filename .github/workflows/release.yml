name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  verify:
    name: Tag matches project version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(uv version --short)"
          test "$tag" = "$project" || { echo "tag v$tag but pyproject says $project" >&2; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: verify
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl qdrant-operator --help
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  image:
    name: Push container image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Push Helm chart
    runs-on: ubuntu-latest
    needs: [verify, image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          helm package charts/qdrant-operator \
            --version "${{ needs.verify.outputs.version }}" \
            --app-version "${{ needs.verify.outputs.version }}" \
            --destination dist/
          helm push dist/qdrant-operator-${{ needs.verify.outputs.version }}.tgz "$CHART_OCI"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/

  github-release:
    name: Attach artifacts to the GitHub release
    runs-on: ubuntu-latest
    needs: [verify, pypi, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release upload "$GITHUB_REF_NAME" artifacts/* manifests/crds/*.yaml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
