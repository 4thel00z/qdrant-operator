name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-please:
    name: Release PR or tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          name="qdrant-operator_${VERSION}_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}/qdrant-operator" ./cmd/operator
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.release-please.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz

  image:
    name: Push container image
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Push Helm chart
    runs-on: ubuntu-latest
    needs: [release-please, image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: azure/setup-helm@v5
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          helm package charts/qdrant-operator \
            --version "${{ needs.release-please.outputs.version }}" \
            --app-version "${{ needs.release-please.outputs.version }}" \
            --destination dist/
          helm push dist/qdrant-operator-${{ needs.release-please.outputs.version }}.tgz "$CHART_OCI"
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/

  assets:
    name: Attach artifacts to the GitHub release
    runs-on: ubuntu-latest
    needs: [release-please, binaries, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: artifacts
      - run: |
          (cd artifacts && sha256sum *.tar.gz *.tgz > checksums.txt)
          gh release upload "${{ needs.release-please.outputs.tag }}" artifacts/* manifests/crds/*.yaml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
