name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  check:
    name: Format, vet, unit and envtest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
      - run: go mod tidy -diff
      - run: make lint
      - run: make test

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Helm adapter integration on kind
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          cluster_name: integration
      - run: make test-integration
        env:
          KUBECONFIG: /home/runner/.kube/config

  e2e:
    name: Operator end-to-end on kind
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: e2e
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: qdrant-operator:e2e
          cache-from: type=gha
      - run: make e2e-deploy KIND_CLUSTER=e2e
      - run: make test-e2e
      - name: Operator logs and resource state
        if: failure()
        run: |
          kubectl logs -n qdrant-system -l app.kubernetes.io/name=qdrant-operator --tail=-1 || true
          kubectl get qc,qcol,qak,qb,qr -A -o yaml || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
