<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Qdrant Operator">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <!-- heptagon hull: the Kubernetes silhouette -->
  <polygon points="128,14 219,58 242,156 178,236 78,236 14,156 37,58" fill="url(#hull)"/>
  <polygon points="128,34 202,70 220,150 168,216 88,216 36,150 54,70" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  <!-- vector edges between the three shard nodes -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.9">
    <line x1="128" y1="82" x2="84" y2="160"/>
    <line x1="128" y1="82" x2="172" y2="160"/>
    <line x1="84" y1="160" x2="172" y2="160"/>
  </g>
  <!-- helm-wheel spokes from the centroid -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="128" y1="134" x2="128" y2="82"/>
    <line x1="128" y1="134" x2="84" y2="160"/>
    <line x1="128" y1="134" x2="172" y2="160"/>
  </g>
  <circle cx="128" cy="134" r="10" fill="#FFFFFF"/>
  <g fill="url(#node)" stroke="#1E1B4B" stroke-width="3">
    <circle cx="128" cy="82" r="18"/>
    <circle cx="84" cy="160" r="18"/>
    <circle cx="172" cy="160" r="18"/>
  </g>
</svg>
