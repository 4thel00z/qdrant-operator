---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: qdrantclusters.qdrant.io
spec:
  group: qdrant.io
  names:
    kind: QdrantCluster
    listKind: QdrantClusterList
    plural: qdrantclusters
    shortNames:
    - qc
    singular: qdrantcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              affinity:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              apiKey:
                properties:
                  autoGenerate:
                    default: false
                    type: boolean
                  jwtRbac:
                    default: false
                    description: Enable JWT role-based access (service.jwt_rbac);
                      QdrantAccessKey resources need it
                    type: boolean
                  secretRef:
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set either secretRef or autoGenerate, not both
                  rule: '!(has(self.secretRef) && self.autoGenerate)'
                - message: jwtRbac needs an API key (secretRef or autoGenerate) to
                    sign tokens with
                  rule: '!self.jwtRbac || has(self.secretRef) || self.autoGenerate'
              cluster:
                properties:
                  enabled:
                    default: true
                    type: boolean
                  p2p:
                    properties:
                      enableTls:
                        default: false
                        type: boolean
                      port:
                        default: 6335
                        format: int32
                        type: integer
                    type: object
                type: object
              config:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              image:
                properties:
                  pullPolicy:
                    default: IfNotPresent
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  repository:
                    default: docker.io/qdrant/qdrant
                    type: string
                type: object
              metrics:
                properties:
                  enabled:
                    default: false
                    type: boolean
                  serviceMonitor:
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      interval:
                        default: 30s
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
              minReadySeconds:
                default: 0
                description: Seconds a pod must be Ready before the rolling update
                  moves to the next one
                format: int32
                minimum: 0
                type: integer
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              persistence:
                properties:
                  accessModes:
                    default:
                    - ReadWriteOnce
                    items:
                      type: string
                    type: array
                  reclaimPolicy:
                    default: Retain
                    description: Delete removes the cluster's PersistentVolumeClaims
                      (data and snapshots) when the QdrantCluster is deleted; Retain
                      keeps them
                    enum:
                    - Retain
                    - Delete
                    type: string
                  size:
                    default: 10Gi
                    description: Volume size per pod; increases are applied to the
                      PVCs and the StatefulSet is recreated, decreases are rejected
                    maxLength: 20
                    type: string
                  storageClassName:
                    type: string
                type: object
              podAnnotations:
                additionalProperties:
                  type: string
                description: Annotations on the Qdrant pods (e.g. scrape hints for
                  a metrics collector)
                type: object
              podDisruptionBudget:
                description: PodDisruptionBudget of the pods; enabled by default when
                  replicas > 1 with maxUnavailable 1
                properties:
                  enabled:
                    description: Unset means on when replicas > 1
                    type: boolean
                  maxUnavailable:
                    anyOf:
                    - type: integer
                    - type: string
                    x-kubernetes-int-or-string: true
                  minAvailable:
                    anyOf:
                    - type: integer
                    - type: string
                    x-kubernetes-int-or-string: true
                type: object
                x-kubernetes-validations:
                - message: set either maxUnavailable or minAvailable, not both
                  rule: '!(has(self.maxUnavailable) && has(self.minAvailable))'
              podLabels:
                additionalProperties:
                  type: string
                type: object
              readOnlyApiKey:
                properties:
                  autoGenerate:
                    default: false
                    type: boolean
                  secretRef:
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set either secretRef or autoGenerate, not both
                  rule: '!(has(self.secretRef) && self.autoGenerate)'
              replicas:
                default: 1
                format: int32
                minimum: 1
                type: integer
              resources:
                properties:
                  limits:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    type: object
                  requests:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    type: object
                type: object
              rollout:
                description: How pods are restarted when the pod template changes
                properties:
                  strategy:
                    default: ShardHealth
                    description: ShardHealth has the operator lower the StatefulSet
                      partition one pod at a time, each only once every pod is Ready,
                      every shard replica is Active, no transfer runs and every pod
                      is a peer. Readiness is the plain StatefulSet RollingUpdate
                      with partition 0
                    enum:
                    - ShardHealth
                    - Readiness
                    type: string
                type: object
              scaling:
                description: Opt-in peer management when the replica count changes
                  or pods are rebuilt
                properties:
                  drainOnScaleDown:
                    default: false
                    description: Before removing pods, move their shard replicas to
                      the remaining peers and remove the peers from consensus
                    type: boolean
                  rebalance:
                    default: false
                    description: Keep every collection at its replication factor and
                      its replicas spread evenly over the pods, e.g. after a scale-up,
                      a restore or a peer repair; one shard operation per collection
                      at a time
                    type: boolean
                  removeDeadPeers:
                    default: false
                    description: Re-replicate shards off peers whose pod was rebuilt
                      on an empty volume, then remove those peers
                    type: boolean
                type: object
              service:
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                  type:
                    default: ClusterIP
                    enum:
                    - ClusterIP
                    - LoadBalancer
                    - NodePort
                    type: string
                type: object
              snapshotPersistence:
                properties:
                  enabled:
                    default: false
                    type: boolean
                  size:
                    default: 10Gi
                    description: Snapshot volume size per pod; size it for the largest
                      snapshot of one node (a full copy of its shards)
                    maxLength: 20
                    type: string
                  storageClassName:
                    type: string
                type: object
              tls:
                properties:
                  caKey:
                    default: ca.crt
                    description: Key in the TLS Secret that holds the CA certificate.
                      Qdrant verifies its peers with it when cluster.p2p.enableTls
                      is on, and the operator verifies Qdrant's HTTPS with it.
                    type: string
                  enabled:
                    default: false
                    type: boolean
                  secretRef:
                    properties:
                      name:
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: tls.enabled requires tls.secretRef.name (a kubernetes.io/tls
                    secret)
                  rule: '!self.enabled || (has(self.secretRef) && has(self.secretRef.name))'
              tolerations:
                items:
                  properties:
                    effect:
                      type: string
                    key:
                      type: string
                    operator:
                      type: string
                    tolerationSeconds:
                      format: int64
                      type: integer
                    value:
                      type: string
                  type: object
                type: array
              topologySpread:
                description: Spread of pods over nodes (on by default when replicas
                  > 1) and zones (opt in)
                properties:
                  constraints:
                    description: Replaces the generated constraints; labelSelector
                      defaults to the cluster's pods; an empty list disables spreading
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                  hostname:
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      maxSkew:
                        default: 1
                        format: int32
                        minimum: 1
                        type: integer
                      whenUnsatisfiable:
                        default: ScheduleAnyway
                        enum:
                        - ScheduleAnyway
                        - DoNotSchedule
                        type: string
                    type: object
                  zone:
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      maxSkew:
                        default: 1
                        format: int32
                        minimum: 1
                        type: integer
                      whenUnsatisfiable:
                        default: ScheduleAnyway
                        enum:
                        - ScheduleAnyway
                        - DoNotSchedule
                        type: string
                    type: object
                type: object
              version:
                description: Qdrant version, also the qdrant-helm chart version (e.g.
                  v1.16.3)
                pattern: ^v?[0-9]+\.[0-9]+\.[0-9]+$
                type: string
            required:
            - version
            type: object
            x-kubernetes-validations:
            - message: replicas > 1 requires cluster.enabled
              rule: self.replicas == 1 || !has(self.cluster) || self.cluster.enabled
            - message: persistence.size can grow but not shrink
              rule: '(has(self.persistence) && has(self.persistence.size) ? quantity(self.persistence.size)
                : quantity(''10Gi'')).compareTo(has(oldSelf.persistence) && has(oldSelf.persistence.size)
                ? quantity(oldSelf.persistence.size) : quantity(''10Gi'')) >= 0'
            - message: snapshotPersistence.size can grow but not shrink
              rule: '(has(self.snapshotPersistence) && has(self.snapshotPersistence.size)
                ? quantity(self.snapshotPersistence.size) : quantity(''10Gi'')).compareTo(has(oldSelf.snapshotPersistence)
                && has(oldSelf.snapshotPersistence.size) ? quantity(oldSelf.snapshotPersistence.size)
                : quantity(''10Gi'')) >= 0'
            - message: persistence.storageClassName is immutable
              rule: '(has(self.persistence) && has(self.persistence.storageClassName)
                ? self.persistence.storageClassName : '''') == (has(oldSelf.persistence)
                && has(oldSelf.persistence.storageClassName) ? oldSelf.persistence.storageClassName
                : '''')'
          status:
            properties:
              appliedHash:
                description: Digest of the chart version and values last applied;
                  an unchanged digest skips the helm upgrade
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              currentRevision:
                type: string
              endpoint:
                type: string
              helmRelease:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Running
                - Failed
                - Upgrading
                - Terminating
                type: string
              readyReplicas:
                format: int32
                type: integer
              replicas:
                format: int32
                type: integer
              updateRevision:
                type: string
              updatedReplicas:
                format: int32
                type: integer
              version:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
